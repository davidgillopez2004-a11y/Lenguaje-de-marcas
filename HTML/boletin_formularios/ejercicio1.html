<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <h2>FUSION DE COLUMNAS</h2>

    <table border="1">
        <tr>
            <th colspan="20">A</tr>
            <th colspan="4">B</th>
            <th>C</th>
        </tr> 

    </table>

<!--Segundo apartado-->

    <h2>FUSION DE FILAS</h2>

    <table border="1">
        <tr align="center">
            <td>A</td>
            <td rowspan="2">B</td>
        </tr>
        <tr align="center">
            <td>C</td>
        </tr>
    </table>

<!--Tercer apartado-->

    <h2>Fusión de columnas</h2>
        <table border="1">
            <tr align="center">
                <td colspan="3">A</td>
                <td>B</td>
            </tr>
            <tr align="center">
                <td>C</td>
                <td colspan="2">D</td>
                <td>E</td>
            </tr>
            <tr align="center">
                <td colspan="4">F</td>
            </tr>
            <tr align="center">
                <td>G</td>
                <td>H</td>
                <td>I</td>
                <td>J</td>
            </tr>
        </table>

<!--Cuarto apartado-->

    <h2>Fusión de filas</h2>
        <table border="1">
            <tr align="center">
                <td>A</td>
                <td>B</td>
                <td rowspan="3">C</td>
                <td>D</td>
            </tr>
            <tr align="center">
                <td rowspan="2">E</td>
                <td>F</td>
                <td rowspan="3">G</td>
            </tr>
            <tr align="center">
                <td>H</td>
            </tr>
            <tr align="center">
                <td>I</td>
                <td>J</td>
                <td>K</td>
            </tr>
        </table>
    </body>
</html>
